name: Internal macOS release

on:
  push:
    tags:
      - "v*"

# 最小权限：本工作流从不使用 GITHUB_TOKEN 写仓库——更新 feed 的 release 由
# secrets.UPDATE_REPO_TOKEN（PAT）在 UPDATE_REPOSITORY 上创建，构建产物走运行时 token。
permissions:
  contents: read

env:
  UPDATE_REPOSITORY: yifeng93/SummitWorkbench-Updates

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflows with actionlint
        uses: raven-actions/actionlint@v2

  release:
    needs: workflow-lint
    # macos-14 是本产品唯一支持的 Apple Silicon release runner。
    runs-on: macos-14
    environment:
      name: release
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag and runner architecture before signing
        id: version
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]]; then
            CHANNEL="rc"
            BASE_VERSION="${BASH_REMATCH[1]}"
          else
            CHANNEL="stable"
            BASE_VERSION="$TAG_VERSION"
          fi
          [[ "$BASE_VERSION" == "$VERSION" ]] || {
            echo "tag $GITHUB_REF_NAME does not match pyproject version v$VERSION (or v$VERSION-rc.N)"
            exit 1
          }
          [[ "$(uname -m)" == "arm64" ]] || {
            echo "release runner must be arm64 Apple Silicon"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Install uv
        # setup-uv 自 v8 起不再发布滚动 major tag（@v8/@v9/@v10 均不存在），必须写完整版本号。
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install OpenSSL 3 signing toolchain
        run: |
          brew install openssl@3
          echo "OPENSSL_BIN=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      - name: Prepare protected update configuration
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_REPO_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
          CONFIGURED_UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          CONFIGURED_UPDATE_DOWNLOAD_URL: ${{ vars.UPDATE_DOWNLOAD_URL }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          [[ -n "$UPDATE_SIGNING_KEY" ]] || { echo "missing release secret UPDATE_SIGNING_KEY" >&2; exit 1; }
          [[ -n "$UPDATE_REPO_TOKEN" ]] || { echo "missing release secret UPDATE_REPO_TOKEN" >&2; exit 1; }
          if [[ "${{ steps.version.outputs.channel }}" == "rc" ]]; then
            EXPECTED_FEED_URL="https://github.com/$UPDATE_REPOSITORY/releases/download/$GITHUB_REF_NAME/update-feed.json"
            UPDATE_FEED_URL="$EXPECTED_FEED_URL"
          else
            EXPECTED_FEED_URL="https://github.com/$UPDATE_REPOSITORY/releases/latest/download/update-feed.json"
            UPDATE_FEED_URL="$CONFIGURED_UPDATE_FEED_URL"
          fi
          EXPECTED_DOWNLOAD_URL="https://github.com/$UPDATE_REPOSITORY/releases/download/$GITHUB_REF_NAME/SummitWorkbench-$RELEASE_VERSION-arm64-INTERNAL-DEV.dmg"
          if [[ "${{ steps.version.outputs.channel }}" == "rc" ]]; then
            UPDATE_DOWNLOAD_URL="$EXPECTED_DOWNLOAD_URL"
          else
            UPDATE_DOWNLOAD_URL="$CONFIGURED_UPDATE_DOWNLOAD_URL"
          fi
          [[ "$UPDATE_FEED_URL" == https://* ]] || { echo "UPDATE_FEED_URL must be HTTPS" >&2; exit 1; }
          [[ "$UPDATE_DOWNLOAD_URL" == https://* ]] || { echo "UPDATE_DOWNLOAD_URL must be HTTPS" >&2; exit 1; }
          [[ "$UPDATE_FEED_URL" == "$EXPECTED_FEED_URL" ]] || {
            echo "UPDATE_FEED_URL must be $EXPECTED_FEED_URL" >&2
            exit 1
          }
          [[ "$UPDATE_DOWNLOAD_URL" == "$EXPECTED_DOWNLOAD_URL" ]] || {
            echo "UPDATE_DOWNLOAD_URL must be $EXPECTED_DOWNLOAD_URL" >&2
            exit 1
          }
          KEY_PATH="$RUNNER_TEMP/update-signing-key.pem"
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$KEY_PATH")
          test "$(stat -f '%Lp' "$KEY_PATH")" = 600
          {
            echo "UPDATE_SIGNING_KEY_PATH=$KEY_PATH"
            echo "UPDATE_FEED_URL=$UPDATE_FEED_URL"
            echo "UPDATE_DOWNLOAD_URL=$UPDATE_DOWNLOAD_URL"
          } >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          uv sync --extra dev --extra web --extra packaging
          uv lock --check
          npm ci --prefix web

      - name: Secret scan
        run: uv run python scripts/secret_scan.py

      - name: Build signed internal arm64 DMG
        env:
          ARCH: arm64
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_OUTPUT_DIR: dist/ci-release
          REQUIRE_SIGNED_UPDATE: "true"
        run: scripts/release-macos.sh

      - name: Run packaged integration tests
        env:
          WB_PACKAGED_APP: dist/ci-release/${{ steps.version.outputs.version }}/arm64/SummitWorkbench.app
        run: uv run pytest -m integration -q

      - name: Run P1-07D dual-device acceptance gate
        run: uv run pytest tests/integration/test_acceptance_dual_device.py -m integration -q

      - name: Upload fully verified package as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SummitWorkbench-${{ github.ref_name }}-arm64
          path: dist/ci-release/**
          if-no-files-found: error

      # Create and fill a draft in the public update repository first. A signing,
      # test, or asset upload failure leaves only a draft and can never publish a
      # partial latest release.
      - name: Create draft public update release
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          if existing_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$UPDATE_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            [[ "$existing_draft" == true ]] || {
              echo "a published release already exists for $GITHUB_REF_NAME" >&2
              exit 1
            }
          else
            EXTRA_FLAGS=()
            if [[ "${{ steps.version.outputs.channel }}" == "rc" ]]; then
              EXTRA_FLAGS+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$UPDATE_REPOSITORY" --draft "${EXTRA_FLAGS[@]}" \
              --title "SummitWorkbench ${{ steps.version.outputs.version }}" \
              --notes "Verified internal arm64 ${{ steps.version.outputs.channel }} candidate; update feed and DMG are integrity-protected."
          fi

      - name: Upload complete assets to public draft
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          PACKAGE_DIR="dist/ci-release/${{ steps.version.outputs.version }}/arm64"
          ASSETS=(
            "$PACKAGE_DIR/SummitWorkbench-${{ steps.version.outputs.version }}-arm64-INTERNAL-DEV.dmg"
            "$PACKAGE_DIR/update-feed.json"
            "$PACKAGE_DIR/release-metadata.json"
            "$PACKAGE_DIR/SBOM.json"
            "$PACKAGE_DIR/notary-log.json"
            "$PACKAGE_DIR/test-manifest.json"
            "$PACKAGE_DIR/SHA256SUMS"
          )
          for asset in "${ASSETS[@]}"; do
            test -f "$asset" || { echo "missing release asset: $asset" >&2; exit 1; }
          done
          gh release upload "$GITHUB_REF_NAME" --repo "$UPDATE_REPOSITORY" "${ASSETS[@]}" --clobber

      - name: Publish complete public update release
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$UPDATE_REPOSITORY" --draft=false
