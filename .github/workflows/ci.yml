name: CI

# 质量门（与本地 lint/format/type/test/build/secret/lock 检查一致）仅在需要时手动触发，
# 避免账单或额度异常时每次推送都产生一个没有 runner 的失败记录。
on:
  workflow_dispatch:

# 最小权限：CI 只读取仓库内容（构建产物用运行时 token 上传）。
permissions:
  contents: read

# 同一分支的新推送取消仍在跑的旧任务，省算力。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate workflows with actionlint
        uses: raven-actions/actionlint@v2

  quality-gate:
    # macOS runner：本工具依赖 macOS 专属能力（Keychain 的 security、launchd、osascript），
    # 诊断/预检会检查这些系统工具存在，故必须在 macOS 上跑质量门。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv 自 v8 起不再发布滚动 major tag（@v8/@v9/@v10 均不存在），必须写完整版本号。
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (dev extra)
        run: uv sync --extra dev

      - name: Verify uv lock
        run: uv lock --check

      - name: Install OpenSSL 3 for real update signing tests
        run: brew install openssl@3

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: pytest with coverage gate
        run: uv run pytest --cov=summit_workbench --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q

      - name: Install Node dependencies from lock
        run: npm ci --prefix web

      - name: TypeScript unused declaration check
        run: cd web && ./node_modules/.bin/tsc --noEmit

      - name: Frontend tests
        run: npm --prefix web run test:frontend

      - name: Frontend build
        run: npm --prefix web run build

      - name: Verify frontend build
        run: node web/scripts/verify-build.mjs src/summit_workbench/webapp/static

      - name: Secret scan
        run: uv run python scripts/secret_scan.py

      - name: Native update behavior tests
        run: scripts/test-native-updates.sh

  macos-build-matrix:
    name: macOS ${{ matrix.architecture }} contract
    strategy:
      fail-fast: false
      matrix:
        include:
          # 产品仅发布 M2+ Apple Silicon；此 job 是完整 arm64 build 门。
          - runner: macos-14
            architecture: arm64
            supported: true
          # Intel 不属于产品支持面；保留独立负向门，确保不会误发 x86 包。
          - runner: macos-15-intel
            architecture: x86_64
            supported: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv 自 v8 起不再发布滚动 major tag（@v8/@v9/@v10 均不存在），必须写完整版本号。
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python packaging dependencies
        run: uv sync --extra dev --extra web --extra packaging

      - name: Install Node dependencies from lock
        run: npm ci --prefix web

      - name: Build supported architecture
        if: matrix.supported == true
        env:
          ARCH: ${{ matrix.architecture }}
          BUILD_NUMBER: ${{ github.run_number }}
          OUTPUT_APP: dist/ci/${{ matrix.architecture }}/SummitWorkbench.app
          # 本步只验证「打包链路 + packaged smoke」，产物不上传、不分发，故**不内置飞书默认凭据**：
          # 凭据只存在于 release environment，而该 environment 的部署策略仅允许 `v*` 标签，
          # main 上的手动 CI 取不到它（2026-09-19 之前这一步因此每次必红）。
          # 脚本对「缺凭据的开发构建」要求**成对**给出下面两个开关（见 build-macos-app.sh:41），
          # 缺一个会硬失败。内置真凭据的构建由 tag 发布（release.yml）与本机发布脚本覆盖。
          REQUIRE_BUNDLED_FEISHU: "false"
          ALLOW_INCOMPLETE_FEISHU_DEV: "true"
        run: scripts/build-macos-app.sh

      - name: Run packaged app smoke test
        if: matrix.supported == true
        env:
          WB_PACKAGED_APP: dist/ci/${{ matrix.architecture }}/SummitWorkbench.app
        run: uv run pytest tests/integration/test_packaged_app.py -m integration -q

      - name: Reject unsupported architecture
        if: matrix.supported == false
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          if scripts/build-macos-app.sh; then
            echo "x86_64 must be rejected by the arm64-only product policy"
            exit 1
          fi
