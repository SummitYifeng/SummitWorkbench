version: 2
# 依赖与 action 版本漂移由 Dependabot 统一跟进。
#
# 动机：setup-uv 自 v8 起停止发布滚动 major tag，手动升级时写 `@v10` 会让 CI 在
# "Set up job" 阶段失败（2026-09-11 实际发生过）。有 Dependabot 后这类版本变更会
# 以 PR 形式出现，并由 CI + pre-push 门禁验证。
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # dulwich 0.22.8 当前没有任何可达漏洞（逐条 CVE 审计见
      # docs/acceptance/OPEN-VERIFICATION-ITEMS.md §I）：3 个 RCE 级 CVE 的受影响范围从
      # 0.23.2/0.24.0 才开始，另两个需要服务端或 SSH——本项目都是纯客户端 + HTTPS。
      # 因此升级属于技术债而非安全修复，需人工评审后显式放开，不自动合并。
      # 官方文档保证 ignore 不影响安全更新（"Security updates are unaffected by this setting"），
      # 所以将来若 0.22.8 真的命中 CVE，安全 PR 仍会照常开出。
      - dependency-name: "dulwich"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
