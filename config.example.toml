# SummitWorkbench 本机配置示例
#
# 复制到 ~/.config/summit_workbench/config.toml（或用 WB_CONFIG_FILE 指向别处）。
# 本文件只放【非敏感】项；任何 app_secret / token / api key 一律进 macOS Keychain，
# 绝不写进本文件或任何 git 仓库（见 NFR-4）。

# work_root = "~/Documents/Work"     # 默认即此，可省略
timezone = "Asia/Shanghai"
log_level = "INFO"

# ── 月度软预算（M1-5）─────────────────────────────────────────────────────────
# 只告警、不阻断新会议。省略 [budget] 或 monthly_soft_limit 则不做预算告警。
# currency 建议与 [models.*.pricing] 的 currency 一致。
[budget]
monthly_soft_limit = 20.0   # 当月估算费用超过此值时，wb status --notify 提示一次
currency = "CNY"

[feishu]
# 飞书自建应用的 App ID（非敏感，可放这里）。
# 注意：分发给同事的安装包已内置默认 app_id / app_secret（见 docs/RELEASING.md），
# 因此这一节**可以整段省略**——省略时运行时用包内内置默认值。
# 一旦写了 [feishu] 表，就必须填全 app_id 与 redirect_uri（缺字段会显式报错，
# 不会被内置默认值掩盖）；显式配置始终优先于内置默认值。
app_id = "cli_xxxxxxxxxxxxxxxx"
# OAuth 回调地址：需与飞书开放平台「安全设置 → 重定向 URL」里登记的一致
redirect_uri = "http://localhost:8765/callback"
# 申请的最小权限 scope（省略则用内置默认）。
# 只请求你已在控制台「权限管理」里开通的 scope，否则授权会报 20027 缺权限。
# 会议相关 scope（视频会议/纪要）的精确标识待 M0-10 在控制台实测确认后再加。
# 最省事的起步：先只用 offline_access 跑通授权与 smoke，再按需加。
# scopes = [
#   "offline_access",              # 必需：授予它才会返回 refresh_token
#   "calendar:calendar",           # 「日历」读写（M2-1 读 + 审批新建会议/行内编辑会议；需控制台开通并重新授权）
#   "task:task:read",              # 「任务」读（M2-1；真机核实粗粒度 task:task 不足，需细粒度）
#   "task:task:write",             # 「任务」写（建/更新/完成）
#   "docx:document:readonly",      # 「云文档」只读
# ]

# ── 凭据存进 Keychain（你自己执行，值不要发给任何人）───────────────────────────
# App Secret：
#   security add-generic-password -a "cli_xxxxxxxxxxxxxxxx" \
#     -s summit-workbench-feishu-app-secret -w -U
#   （-w 不带值会安全交互式提示输入，不落命令历史）
# refresh_token 由 `wb feishu login` 在授权后自动写入，无需手工存。
#
# 授权流程：
#   wb feishu authorize-url         # 打印授权链接，浏览器打开并同意
#   wb feishu login --code <code>   # 用回调里的 code 换令牌，存 refresh_token
#   wb feishu smoke                 # 刷新 token 并调 user_info，验证链路

# ── 云端模型（M0-6）──────────────────────────────────────────────────────────
# 五类能力：meeting（逐字稿结构化）/ ranking（简报排序）/ capture（一句话分类）/
# digest（线程日志摘要与产物索引）/ review（预留，当前无模型调用）。
# 未单独配置的能力回退 [models.shared]；**建议逐能力写全**，否则某天某个任务出问题
# 时，从配置上分辨不出它到底用了哪套参数。
# 只放非敏感项；api key 进 Keychain（见下）。base_url 填 API 根，代码会拼 /chat/completions。
#
# 两条 DeepSeek-V4 系列的关键口径（2026-09-18 真机踩过）：
#   1) 思考模式**默认打开**且 reasoning_effort=high，推理 token 与最终答案**共用**
#      max_output_tokens —— 预算太小会出现"输出为空、却报 schema 不符合"。
#   2) 1M 上下文只代表**输入**容量，输出上限另算（该模型文档写 384K）。
# 因此抽取/摘要/分类类任务一律 thinking="disabled"（更快、更省、JSON 更稳）。
[models.shared]                          # 兜底
model_id = "deepseek-flash"
base_url = "https://api.deepseek.com/v1"
credential_account = "shared"
timeout_seconds = 60
thinking = "disabled"
max_output_tokens = 16384
context_window_tokens = 65536         # 输入侧安全窗口（达到 85% 时启用分段）
context_safety_ratio = 0.85

[models.shared.pricing]                 # 单价用于费用估算（每百万 token），按你的实际计费填
currency = "CNY"
input_per_mtok = 0.0
output_per_mtok = 0.0

[models.meeting]                        # 长输入 + 严格 JSON：超时给足
model_id = "deepseek-flash"
base_url = "https://api.deepseek.com/v1"
credential_account = "shared"
thinking = "disabled"
max_output_tokens = 16384
context_window_tokens = 65536
timeout_seconds = 300

[models.ranking]                        # 简报/复盘排序：短输入
thinking = "disabled"
max_output_tokens = 8192
timeout_seconds = 120

[models.capture]                        # 一句话分类：极小输入输出
thinking = "disabled"
max_output_tokens = 4096
timeout_seconds = 20

[models.digest]                         # 线程日志摘要 / 产物索引：长文档，会自行分段
thinking = "disabled"
max_output_tokens = 8192
timeout_seconds = 120

# api key 存 Keychain（account 要与上面 credential_account 一致）：
#   security add-generic-password -a "shared" \
#     -s summit-workbench-model-api-key -w -U
# 冒烟：
#   wb model smoke <真实逐字稿.md>   # 结构化 + 记录 token/费用
